<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video 1.1: What a flame needs</title>
<!-- Learners page video 1.1. AI-assisted animation (Claude Code). Original drawings. Drawn as a function of time by engine.js. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&family=Geist+Mono:wght@500&display=block" rel="stylesheet">
<link rel="stylesheet" href="scene.css">
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-label="Animation: what a flame needs"></svg>
<div id="cap" hidden></div>
<div id="ctl" hidden><button type="button">Play</button><input type="range" min="0" value="0" aria-label="Time"><output>0.0 s</output></div>
<script src="engine.js"></script>
<script>
E.scene('1-1', function (E, root) {
  var C = E.C, el = E.el, set = E.set, at = E.at, win = E.window, L = E.label;
  var B = {};
  ['triangle', 'remove', 'pillars', 'diffusion', 'meet', 'equation', 'starve', 'kinds', 'counts', 'solids'].forEach(function (b) { B[b] = E.beat(b); });
  var END = E.timing.duration;
  E.flameDefs(root);
  var chap = E.chapter(root, '1.1', 'What a flame needs');

  /* ---------- A: the fire triangle ---------- */
  var A = el('g', {}, root), TX = 960, TY = 560;
  var V = { top: [TX, TY - 330], bl: [TX - 330, TY + 240], br: [TX + 330, TY + 240] };
  function side(a, b, color) { return el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: color, 'stroke-width': 22, 'stroke-linecap': 'round' }, A); }
  var sFuel = side(V.bl, V.top, C.amber), sOxy = side(V.top, V.br, C.blue), sHeat = side(V.bl, V.br, C.red);
  [sFuel, sOxy, sHeat].forEach(function (s) { var len = Math.hypot(s.x2.baseVal.value - s.x1.baseVal.value, s.y2.baseVal.value - s.y1.baseVal.value); s.len = len; set(s, { 'stroke-dasharray': len, 'stroke-dashoffset': len }); });
  var lFuel = L('FUEL', TX - 300, TY - 70, 44, C.amber, { weight: 600, anchor: 'end' }, A);
  var lOxy = L('OXYGEN', TX + 300, TY - 70, 44, C.blueSoft, { weight: 600 }, A);
  var lHeat = L('HEAT', TX, TY + 330, 44, C.red, { weight: 600, anchor: 'middle' }, A);
  var halo = el('circle', { cx: TX, cy: TY + 60, r: 170, fill: 'url(#haloWarm)' }, A);
  var flame = el('path', { fill: 'url(#warm)' }, A);
  var puff = el('circle', { cx: TX, cy: TY + 20, fill: C.grey }, A);

  /* prevent, detect, suppress */
  var P = el('g', {}, root), cards = [];
  [['PREVENT', 'pick materials, control sparks', C.amber], ['DETECT', 'notice smoke early', C.blueSoft], ['SUPPRESS', 'take away oxygen or heat', C.teal]].forEach(function (c, i) {
    var g = el('g', {}, P), y = 300 + i * 190;
    el('rect', { x: 1060, y: y, width: 700, height: 150, rx: 26, fill: C.panel, stroke: C.line, 'stroke-width': 2 }, g);
    el('circle', { cx: 1140, cy: y + 75, r: 34, fill: 'none', stroke: c[2], 'stroke-width': 8 }, g);
    if (i === 0) el('path', { d: 'M1124 ' + (y + 76) + ' l12 12 l22 -24', fill: 'none', stroke: c[2], 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
    if (i === 1) el('path', { d: 'M1122 ' + (y + 84) + ' q9 -18 18 0 t18 0', fill: 'none', stroke: c[2], 'stroke-width': 7, 'stroke-linecap': 'round' }, g);
    if (i === 2) el('path', { d: 'M1140 ' + (y + 54) + ' q20 26 0 42 q-20 -16 0 -42z', fill: c[2] }, g);
    L(c[0], 1210, y + 66, 40, C.ink, { weight: 600 }, g);
    L(c[1], 1210, y + 110, 30, C.muted, {}, g);
    cards.push(g);
  });

  /* ---------- B: a diffusion flame around fuel ---------- */
  var D = el('g', {}, root), DX = 760, DY = 600;
  var fuelG = el('radialGradient', { id: 'fuelG' }, root.querySelector('defs'));
  el('stop', { offset: 0, 'stop-color': C.amber, 'stop-opacity': .95 }, fuelG); el('stop', { offset: 1, 'stop-color': C.amber, 'stop-opacity': .15 }, fuelG);
  var fuel = el('circle', { cx: DX, cy: DY, fill: 'url(#fuelG)' }, D);
  var lFuel2 = L('FUEL', DX, DY + 14, 40, C.bg, { weight: 600, anchor: 'middle' }, D);
  var ring = el('circle', { cx: DX, cy: DY, fill: 'none', stroke: C.red, 'stroke-width': 16 }, D);
  var ringIn = el('circle', { cx: DX, cy: DY, fill: 'none', stroke: C.cream, 'stroke-width': 5 }, D);
  var oxy = [], r1 = E.rand(5);
  for (var i = 0; i < 26; i++) oxy.push({ g: E.mol(D, C.blue, 12), a: r1() * 2 * Math.PI, p: r1(), spin: r1() * 360 });
  var lOxy2 = L('OXYGEN', DX + 470, DY - 300, 40, C.blueSoft, { weight: 600 }, D);
  var lMeet = L('the flame: a thin layer where they meet', DX + 300, DY + 330, 36, C.amber, {}, D);
  var lSlow = L('less oxygen arriving, slower burning', DX + 300, DY + 330, 36, C.muted, {}, D);

  /* propane equation */
  var Q = el('g', {}, root), QX = 1060;
  var prop = el('g', {}, Q);
  [0, 1, 2].forEach(function (k) { el('circle', { cx: QX + 60 + k * 50, cy: 380, r: 30, fill: '#4b5563' }, prop); });
  [[-34, -30], [-40, 18], [0, -46], [0, 46], [50, -46], [50, 46], [140, -30], [146, 18]].forEach(function (h) { el('circle', { cx: QX + 60 + h[0], cy: 380 + h[1], r: 13, fill: '#e9eef8' }, prop); });
  L('1 propane', QX + 110, 470, 30, C.muted, { anchor: 'middle' }, Q);
  L('+', QX + 260, 395, 52, C.ink, { anchor: 'middle' }, Q);
  var o2s = [];
  for (var j = 0; j < 5; j++) { var m = E.mol(Q, C.blue, 16); E.place(m, QX + 360 + (j % 3) * 80, 350 + Math.floor(j / 3) * 64); o2s.push(m); }
  L('5 oxygen', QX + 440, 470, 30, C.muted, { anchor: 'middle' }, Q);
  var eq = el('text', E.font(46, 500, true), Q); set(eq, { x: QX, y: 600, fill: C.ink });
  [['C', 0], ['3', 1], ['H', 0], ['8', 1], [' + 5 O', 0], ['2', 1], ['  →', 0]].forEach(function (p) { var s = el('tspan', p[1] ? { 'font-size': 30, dy: 10 } : { dy: 0 }, eq); s.textContent = p[0]; s.sub = p[1]; });
  [].slice.call(eq.childNodes).forEach(function (s, k, all) { if (!s.sub && k && all[k - 1].sub) s.setAttribute('dy', -10); });
  var eq2 = el('text', E.font(46, 500, true), Q); set(eq2, { x: QX, y: 670, fill: C.ink });
  [['3 CO', 0], ['2', 1], [' + 4 H', 0], ['2', 1], ['O', 0]].forEach(function (p, k, all) { var s = el('tspan', p[1] ? { 'font-size': 30, dy: 10 } : { dy: k && all[k - 1][1] ? -10 : 0 }, eq2); s.textContent = p[0]; });
  var heat = L('+ heat', QX + 470, 670, 46, C.red, { mono: true }, Q);

  /* ---------- C: three kinds of fuel, NASA's counts, and why solids matter ---------- */
  var K = el('g', {}, root), cols = [], XS = [480, 960, 1440], N = [660, 353, 263];
  ['GAS FLAMES', 'FUEL DROPLETS', 'SOLID MATERIALS'].forEach(function (name, k) {
    var g = el('g', {}, K), x = XS[k], icon = el('g', {}, g);
    if (k === 0) { var r2 = E.rand(9); for (var n = 0; n < 14; n++) el('circle', { cx: x + (r2() - .5) * 150, cy: 330 + (r2() - .5) * 110, r: 14 + r2() * 12, fill: C.amber, opacity: .35 + r2() * .4 }, icon); }
    if (k === 1) { el('circle', { cx: x, cy: 330, r: 80, fill: 'url(#cool)' }, icon); el('circle', { cx: x, cy: 330, r: 22, fill: '#d9c48a' }, icon); }
    if (k === 2) { el('rect', { x: x - 110, y: 270, width: 220, height: 120, rx: 10, fill: '#7c6a58' }, icon); for (var s = 0; s < 6; s++) el('line', { x1: x - 110 + 20 + s * 36, y1: 270, x2: x - 110 + 20 + s * 36, y2: 390, stroke: '#9c8873', 'stroke-width': 8 }, icon); }
    L(name, x, 470, 36, C.ink, { weight: 600, anchor: 'middle' }, g);
    var bar = el('rect', { x: x - 180, y: 520, height: 26, rx: 13, fill: C.amber }, g);
    var num = L('', x, 620, 64, C.ink, { mono: true, anchor: 'middle' }, g);
    var sub = L('tests', x, 668, 30, C.muted, { anchor: 'middle' }, g);
    cols.push({ g: g, bar: bar, num: num, sub: sub, outline: el('rect', { x: x - 210, y: 210, width: 420, height: 490, rx: 30, fill: 'none', stroke: C.amber, 'stroke-width': 5 }, g) });
  });
  var cabin = el('g', {}, K), items = [];
  [['fabric', function (g, x) { el('path', { d: 'M' + (x - 70) + ' 820 q35 -30 70 0 t70 0 v70 q-35 -30 -70 0 t-70 0z', fill: '#5f7fb8' }, g); }],
   ['plastic', function (g, x) { el('rect', { x: x - 60, y: 800, width: 120, height: 100, rx: 22, fill: '#c9ccd6' }, g); el('rect', { x: x - 40, y: 815, width: 26, height: 60, rx: 13, fill: '#ffffff', opacity: .55 }, g); }],
   ['wiring', function (g, x) { el('path', { d: 'M' + (x - 80) + ' 880 C ' + (x - 30) + ' 780, ' + (x + 30) + ' 920, ' + (x + 80) + ' 820', fill: 'none', stroke: C.red, 'stroke-width': 18, 'stroke-linecap': 'round' }, g); el('path', { d: 'M' + (x - 80) + ' 880 C ' + (x - 30) + ' 780, ' + (x + 30) + ' 920, ' + (x + 80) + ' 820', fill: 'none', stroke: C.amber, 'stroke-width': 5, 'stroke-linecap': 'round' }, g); }]
  ].forEach(function (it, k) { var g = el('g', {}, cabin), x = 1140 + k * 230; it[1](g, x); L(it[0], x, 950, 30, C.muted, { anchor: 'middle' }, g); items.push(g); });
  var lCabin = L('a spacecraft is full of them', 400, 880, 40, C.amber, { weight: 600 }, cabin);

  return function draw(t) {
    set(chap, { opacity: (.35 + .65 * (1 - at(t, 5, 1))) * (1 - at(t, END - 1, 1)) });

    /* A: triangle draws in, oxygen side pulled away and back, then it slides left for the three jobs */
    var aOn = 1 - at(t, B.diffusion - .6, .8);
    var slide = at(t, B.pillars, 1.2, E.ease.inOut);
    set(A, { opacity: aOn, transform: 'translate(' + (-430 * slide).toFixed(1) + ' 0) scale(' + (1 - .25 * slide) + ')', 'transform-origin': TX + 'px ' + TY + 'px' });
    [sFuel, sOxy, sHeat].forEach(function (s, k) { set(s, { 'stroke-dashoffset': s.len * (1 - at(t, .3 + k * .9, 1, E.ease.inOut)) }); });
    set(lFuel, { opacity: at(t, .9, .6) }); set(lHeat, { opacity: at(t, 2.6, .6) });
    var pull = at(t, B.remove + .2, .7, E.ease.inOut) * (1 - at(t, B.remove + 2.4, .7, E.ease.inOut));
    set(sOxy, { transform: 'translate(' + (240 * pull).toFixed(1) + ' ' + (-60 * pull).toFixed(1) + ')', opacity: 1 - .5 * pull });
    set(lOxy, { opacity: at(t, 1.8, .6) * (1 - .5 * pull), transform: 'translate(' + (240 * pull).toFixed(1) + ' ' + (-60 * pull).toFixed(1) + ')' });
    var lit = at(t, 3.4, .8, E.ease.back) * (1 - pull);
    set(flame, { d: E.flameShape(1, 46 * Math.max(.01, lit), TX, TY + 90, 8 * Math.sin(t * 9) * lit), opacity: lit > .02 ? 1 : 0 });
    set(halo, { opacity: lit });
    set(puff, { r: 30 + 60 * pull, opacity: .5 * pull * (1 - at(t, B.remove + 1.5, .8)), cy: TY + 20 - 80 * pull });
    set(P, { opacity: 1 - at(t, B.diffusion - .6, .8) });
    cards.forEach(function (c, k) { var p = at(t, B.pillars + .8 + k * 1.3, .6, E.ease.back); set(c, { opacity: at(t, B.pillars + .8 + k * 1.3, .5), transform: 'translate(' + (60 * (1 - p)).toFixed(1) + ' 0)' }); });

    /* B: fuel, oxygen, the thin flame layer; then the reaction; then starving */
    var dOn = win(t, B.diffusion, B.kinds - .6);
    var shrink = at(t, B.equation, 1.2, E.ease.inOut);
    set(D, { opacity: dOn, transform: 'translate(' + (-290 * shrink).toFixed(1) + ' 0) scale(' + (1 - .3 * shrink) + ')', 'transform-origin': DX + 'px ' + DY + 'px' });
    var vap = at(t, B.meet, 2, E.ease.inOut), starve = at(t, B.starve + .3, 2.2, E.ease.inOut);
    set(fuel, { r: 110 + 90 * vap });
    var ringOn = at(t, B.meet + 1.2, 1), rr = 250;
    set(ring, { r: rr, opacity: ringOn * (1 - .6 * starve), 'stroke-width': 16 * (1 - .5 * starve) });
    set(ringIn, { r: rr, opacity: ringOn * (1 - .7 * starve) });
    oxy.forEach(function (o, k) {
      var life = ((t - B.diffusion) * .12 * (1 - .75 * starve) + o.p) % 1, rad = E.lerp(440, rr + 20, Math.max(0, life) * vap + (1 - vap) * 0);
      if (vap < .01) rad = 330 + o.p * 110;
      var a = o.a + .2 * Math.sin(t * .5 + k);
      E.place(o.g, DX + rad * Math.cos(a), DY + rad * Math.sin(a), o.spin + t * 25, 1, (1 - .7 * starve) * (vap > .01 ? Math.min(1, (440 - rad) / 60 + .3) : 1));
    });
    set(lOxy2, { opacity: at(t, B.diffusion + .5, .6) * (1 - shrink) });
    set(lFuel2, { opacity: at(t, B.diffusion + .3, .6) });
    set(lMeet, { opacity: win(t, B.meet + 2, B.equation) });
    set(lSlow, { opacity: win(t, B.starve + .8, B.kinds - .6), transform: 'translate(-60 0)' });
    set(Q, { opacity: win(t, B.equation + .6, B.kinds - .6) });
    o2s.forEach(function (m, k) { set(m, { opacity: at(t, B.equation + 1 + k * .25, .4) * (k >= 2 ? 1 - .8 * starve : 1) }); });
    set(heat, { opacity: at(t, B.equation + 4.5, .6) * (1 - .6 * starve) });

    /* C: three kinds, counts, solids */
    set(K, { opacity: at(t, B.kinds, .8) * (1 - at(t, END - 1, 1)) });
    cols.forEach(function (c, k) {
      var on = at(t, B.kinds + .4 + k * 1.2, .6, E.ease.back), cnt = at(t, B.counts + .3 + k * 1.6, 2, E.ease.inOut);
      var dim = k < 2 ? 1 - .65 * at(t, B.solids, .8) : 1;
      set(c.g, { opacity: at(t, B.kinds + .4 + k * 1.2, .5) * dim, transform: 'translate(0 ' + (30 * (1 - on)).toFixed(1) + ')' });
      set(c.bar, { width: Math.max(.1, 360 * N[k] / 660 * cnt), opacity: cnt > 0 ? 1 : 0 });
      c.num.textContent = cnt > 0 ? String(Math.round(N[k] * cnt)) : '';
      set(c.sub, { opacity: cnt > 0 ? 1 : 0 });
      set(c.outline, { opacity: k === 2 ? at(t, B.solids, .8) : 0 });
    });
    set(K.lastChild, { opacity: 1 });
    items.forEach(function (g, k) { var p = at(t, B.solids + 1.2 + k * .7, .6, E.ease.back); set(g, { opacity: at(t, B.solids + 1.2 + k * .7, .4), transform: 'translate(0 ' + (40 * (1 - p)).toFixed(1) + ')' }); });
    set(lCabin, { opacity: at(t, B.solids + .6, .6) });
  };
});
</script>
</body>
</html>
